name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies (frozen)
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run pytest -q

  lint:
    # 只在 PR 上強制 lint/format，避免一次性導入 ruff 時需要全 repo 大掃除。
    # 之後可以逐步把檢查範圍擴大到全 repo。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --frozen --all-groups

      - name: Ruff (lint + format) on changed Python files
        shell: bash
        env:
          # gh CLI 在 Actions 中需要 token；缺少時 gh 會失敗
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"

          # 取得變更清單失敗（例如 gh 認證問題）必須讓 job 失敗，
          # 不可被當成「沒有 Python 變更」而跳過 ruff（原本的 false green）。
          # 用 PR files API（分頁、只列檔名）；`gh pr diff` 在 diff 超過 20,000 行時
          # 會回 HTTP 406，大型 PR 無法取得清單。已刪除的檔案不列入。
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | .filename' > changed-files.txt

          # 只有「沒有符合的檔案」才允許空結果；只保留仍存在的 .py 檔
          FILES=""
          while IFS= read -r f; do
            if [[ "$f" == *.py && -f "$f" ]]; then
              FILES+="$f"$'\n'
            fi
          done < changed-files.txt
          FILES="${FILES%$'\n'}"

          if [ -z "$FILES" ]; then
            echo "No Python files changed; skipping ruff."
            exit 0
          fi

          echo "Changed Python files:"
          echo "$FILES"

          echo "$FILES" | xargs uv run ruff check
          echo "$FILES" | xargs uv run ruff format --check
