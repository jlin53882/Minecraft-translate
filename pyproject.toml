[project]
name = "minecraft-translator-flet"
version = "0.6.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet-cli==0.28.3",
    "flet-desktop==0.28.3",
    "flet-web==0.28.3",
    "flet[all]==0.28.3",
    "ftb-snbt-lib>=0.4.1",
    "google-genai>=1.56.0",
    "httpx>=0.28.1",
    "opencc-python-reimplemented>=0.1.7",
    "orjson>=3.11.3",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "pytest>=9.0.2",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["backups"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "tools/", ".venv/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "E", "F", "W"]

# 預存檔的 E501（行太長）與 E402（import 順序）寬限
[tool.ruff.lint.per-file-ignores]
"app/views/config/*" = ["E501"]
"app/views/translation/*" = ["E501"]
"app/views/extractor/*" = ["E501"]
"app/views/rules/*" = ["E501"]
"app/views/cache_manager/*" = ["E501"]
"app/views/cache/*.py" = ["E501"]
"app/view_registry.py" = ["E501"]
"app/logging/*" = ["E501", "E741"]
"app/services_impl/**" = ["E501"]
"app/views/qc_view.py" = ["E501"]
"main.py" = ["E501", "E402"]
"tests/*.py" = ["E501", "E402", "E701", "E702"]
"tools/*.py" = ["E501", "E402", "E702", "E722"]
"translation_tool/**" = ["E501"]
"translation_tool/plugins/*" = ["E501"]
"translation_tool/core/ftb_translator.py" = ["E501"]
"translation_tool/core/kubejs_translator.py" = ["E501"]
"translation_tool/core/lang_merger.py" = ["E501"]
"translation_tool/core/jar_processor*.py" = ["E501"]
"translation_tool/utils/*.py" = ["E501"]
